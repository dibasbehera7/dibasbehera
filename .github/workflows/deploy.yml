name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every check below gates the publish step: a failing check leaves the
  # currently published site untouched.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The build runs before the tests because part of the suite asserts against
      # the exported output in out/.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /dibasbehera

      - name: Unit and component tests
        run: npm test

      - name: External repository links resolve
        run: npm test
        env:
          # Opts the network-gated link check in; skipped in the run above.
          CHECK_EXTERNAL_LINKS: "1"

      - name: Bundle budget, internal links, and booking isolation
        run: npm run verify:site
        env:
          NEXT_PUBLIC_BASE_PATH: /dibasbehera

      - name: Route names do not collide with published project sites
        run: npm run check:collisions

      - name: Reflow and CSP browser checks
        run: npm run check:browser
        env:
          NEXT_PUBLIC_BASE_PATH: /dibasbehera

      - name: Lighthouse accessibility and performance thresholds
        run: npm run lighthouse
        env:
          # Required: without it the audit server serves the site from the root
          # while the build references /dibasbehera, so every asset 404s and the
          # page is measured unstyled.
          NEXT_PUBLIC_BASE_PATH: /dibasbehera

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
      needs: deploy
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5

        # Confirms the published site behaves as specified, not just the build.
        - name: Live site checks
          run: npm run check:live
          env:
            SITE_URL: https://dibasbehera7.github.io/dibasbehera
